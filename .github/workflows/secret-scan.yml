name: Secret scan

# Called by test.yml on every CI run, and every other job there `needs:` it --
# so a leaked secret stops CI. It can also be run by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history: the action diffs base..head, and with no previous
      # commit (first push, release, manual run) it scans everything.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@a5f3de55cc2065ae4dde8fee24076f137fd62fcf # v3.97.8
        with:
          # Pin the scanner image too; the action defaults to `latest`.
          version: 3.97.8
          # Also fail on findings that can't be verified against the live
          # service -- e.g. a device password has nothing to verify against.
          extra_args: --results=verified,unknown
